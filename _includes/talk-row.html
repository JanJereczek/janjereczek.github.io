{% include base_path %}
<div class="row row--talk">
  <div class="row__date">{{ post.date | date: "%b %Y" }}</div>
  <div class="row__body">
    <h3 class="row__title"><a href="{{ base_path }}{{ post.url }}">{{ post.title }}</a></h3>
    <p class="row__meta"><span class="row__tag">{{ post.type }}</span>{{ post.venue }}, {{ post.location }}{% if post.recording %} <a class="row__recording" href="{{ post.recording }}">&#9654; Recording</a>{% endif %}</p>
  </div>
</div>
